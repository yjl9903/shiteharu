op="insert"
segment_id="c001"
start=403.003
end=405.972
speaker="speaker_0"
ja="雨も止んだので少しブラブラしましょうか"
[[operations]]
op="insert"
segment_id="c002"
start=405.972
end=408.742
speaker="speaker_0"
ja="ひらけた緑と川がとっても気持ちいいです"
[[operations]]
op="insert"
segment_id="c003"
start=409.776
end=411.177
speaker="speaker_0"
ja="ニワトリ"
[[operations]]
op="insert"
segment_id="c004"
start=411.177
end=414.014
speaker="speaker_0"
ja="散歩していたら元気な\nコケコッコーが聞こえてきたので"
[[operations]]
op="insert"
segment_id="c005"
start=414.014
end=414.981
speaker="speaker_0"
ja="何かと思ったら"
[[operations]]
op="insert"
segment_id="c006"
start=414.981
end=417.150
speaker="speaker_0"
ja="ニワトリが野に放たれています"
[[operations]]
op="insert"
segment_id="c007"
start=417.150
end=420.453
speaker="speaker_0"
ja="どうやらここで\n飼育されているニワトリみたいですね"
[[operations]]
op="insert"
segment_id="c008"
start=420.453
end=422.422
speaker="speaker_0"
ja="大量のスズメと数羽のニワトリ"
[[operations]]
op="insert"
segment_id="c009"
start=422.422
end=425.058
speaker="speaker_0"
ja="コケコッコー練習中の子もいます"
[[operations]]
op="insert"
segment_id="c010"
start=427.027
end=429.329
speaker="speaker_0"
ja="最後急に不安になっちゃう気持ち"
[[operations]]
op="insert"
segment_id="c011"
start=429.329
end=430.664
speaker="speaker_0"
ja="わかりますよ"
[[operations]]
op="insert"
segment_id="c012"
start=430.664
end=433.800
speaker="speaker_0"
ja="話を聞くとたまに\nオーナーさんが外で作業する時"
[[operations]]
op="insert"
segment_id="c013"
start=433.800
end=436.136
speaker="speaker_0"
ja="数羽一緒に外へ放しているのだとか"
[[operations]]
op="insert"
segment_id="c014"
start=436.136
end=437.904
speaker="speaker_0"
ja="小屋の中のスズメやムクドリは"
[[operations]]
op="insert"
segment_id="c015"
start=437.904
end=439.472
speaker="speaker_0"
ja="勝手に入ってきている子達で"
[[operations]]
op="insert"
segment_id="c016"
start=439.472
end=441.308
speaker="speaker_0"
ja="たまにカラスも入ってきたりするけど"
[[operations]]
op="insert"
segment_id="c017"
start=441.308
end=444.311
speaker="speaker_0"
ja="結局なんだかんだ\nうまく共生しているみたいです"
[[operations]]
op="insert"
segment_id="c018"
start=444.311
end=445.946
speaker="speaker_0"
ja="ちなみにこの施設の中は"
[[operations]]
op="insert"
segment_id="c019"
start=445.946
end=449.115
speaker="speaker_0"
ja="たくさんのたんぽぽの綿毛や\nピールアートが展示されている"
[[operations]]
op="insert"
segment_id="c020"
start=449.115
end=450.483
speaker="speaker_0"
ja="インスタレーションなアトリエで"
[[operations]]
op="insert"
segment_id="c021"
start=450.483
end=452.819
speaker="speaker_0"
ja="とっても素敵空間でしたよ"
[[operations]]
op="insert"
segment_id="c022"
start=460.694
end=463.763
speaker="speaker_0"
ja="歩いていたらまた大粒の雨が降ってきました"
[[operations]]
op="insert"
segment_id="c023"
start=463.763
end=464.931
speaker="speaker_0"
ja="いい感じの公園があったので"
[[operations]]
op="insert"
segment_id="c024"
start=464.931
end=467.667
speaker="speaker_0"
ja="ベンチでちょっと雨宿りさせてもらいましょう"
[[operations]]
op="insert"
segment_id="c025"
start=467.667
end=470.971
speaker="speaker_0"
ja="空と身体の間に一枚板を\n挟むだけで濡れなくなる"
[[operations]]
op="insert"
segment_id="c026"
start=470.971
end=472.138
speaker="speaker_0"
ja="屋根という存在"
[[operations]]
op="insert"
segment_id="c027"
start=472.138
end=473.840
speaker="speaker_0"
ja="本当に面白い"
[[operations]]
op="insert"
segment_id="c028"
start=473.840
end=475.909
speaker="speaker_0"
ja="雨を一時的に凌ぐこの時間も"
[[operations]]
op="insert"
segment_id="c029"
start=475.909
end=478.611
speaker="speaker_0"
ja="雨宿りという単語を考えた人の感性も"
[[operations]]
op="insert"
segment_id="c030"
start=478.611
end=481.314
speaker="speaker_0"
ja="その豊かさを大切にしたいものですね"
[[operations]]
op="insert"
segment_id="c031"
start=481.314
end=482.482
speaker="speaker_0"
ja="止みました"
[[operations]]
op="insert"
segment_id="c032"
start=482.482
end=485.118
speaker="speaker_0"
ja="通り雨だったみたいで助かりましたね"
[[operations]]
op="insert"
segment_id="c033"
start=485.118
end=487.420
speaker="speaker_0"
ja="そして雨が降ったということは"
[[operations]]
op="insert"
segment_id="c034"
start=487.420
end=490.056
speaker="speaker_0"
ja="おそらく地面を掘れば…"
[[operations]]
op="insert"
segment_id="c035"
start=490.056
end=491.191
speaker="speaker_0"
ja="ありました！"
[[operations]]
op="insert"
segment_id="c036"
start=491.191
end=493.226
speaker="speaker_0"
ja="吾郎島銀時"
[[operations]]
op="insert"
segment_id="c037"
start=493.226
end=495.061
speaker="speaker_0"
ja="銀色の雨が土に染み込むと"
[[operations]]
op="insert"
segment_id="c038"
start=495.061
end=498.465
speaker="speaker_0"
ja="シロガニウムが反応して\n一時的に銀色に変色する"
[[operations]]
op="insert"
segment_id="c039"
start=498.465
end=500.533
speaker="speaker_0"
ja="不思議な野菜なんですね～"
[[operations]]
op="insert"
segment_id="c040"
start=500.533
end=503.403
speaker="speaker_0"
ja="栗のようなホクホク感と上品な甘さが特徴で"
[[operations]]
op="insert"
segment_id="c041"
start=503.403
end=507.507
speaker="speaker_0"
ja="これからの季節を背負うに\nふさわしいこっぼこぼなお芋です"
[[operations]]
op="insert"
segment_id="c042"
start=507.507
end=509.909
speaker="speaker_0"
ja="さて 移動するべくバスへ乗車"
[[operations]]
op="insert"
segment_id="c043"
start=509.909
end=513.580
speaker="speaker_0"
ja="バスの車窓に水滴が流れると\n強制的に景色がボヤけて"
[[operations]]
op="insert"
segment_id="c044"
start=513.580
end=515.915
speaker="speaker_0"
ja="詳細な情報をシャットアウトしてくれるので"
[[operations]]
op="insert"
segment_id="c045"
start=515.915
end=519.285
speaker="speaker_0"
ja="なんとなく目にも脳にも\n優しくてありがたいですね"
[[operations]]
op="insert"
segment_id="c046"
start=523.156
end=524.991
speaker="speaker_0"
ja="気軽に海鮮丼に並んでみたら"
[[operations]]
op="insert"
segment_id="c047"
start=524.991
end=527.327
speaker="speaker_0"
ja="3時間待ち"
[[operations]]
op="insert"
segment_id="c048"
start=527.327
end=529.596
speaker="speaker_0"
ja="気づけばすっかり夜になってしまいました"
[[operations]]
op="insert"
segment_id="c049"
start=529.596
end=532.599
speaker="speaker_0"
ja="おやつのつもりが\n夜ご飯になってしまいましたね"
[[operations]]
op="insert"
segment_id="c050"
start=532.599
end=534.634
speaker="speaker_0"
ja="昼の活気ある風景も良しですが"
[[operations]]
op="insert"
segment_id="c051"
start=534.634
end=537.303
speaker="speaker_0"
ja="夜は暖色に統一されたあたたかい光"
[[operations]]
op="insert"
segment_id="c052"
start=537.303
end=539.339
speaker="speaker_0"
ja="静けさと涼しさが心地よくって"
[[operations]]
op="insert"
segment_id="c053"
start=539.339
end=542.042
speaker="speaker_0"
ja="夜こそが本来の姿のような気さえします"
[[operations]]
op="insert"
segment_id="c054"
start=542.042
end=544.978
speaker="speaker_0"
ja="コンクリートジャングルの夜も\nしっとりと品のある夜も"
[[operations]]
op="insert"
segment_id="c055"
start=544.978
end=546.312
speaker="speaker_0"
ja="どちらも情緒的ですが"
[[operations]]
op="insert"
segment_id="c056"
start=546.312
end=549.315
speaker="speaker_0"
ja="その種類に違いがあって面白いですね"
[[operations]]
op="insert"
segment_id="c057"
start=549.315
end=551.818
speaker="speaker_0"
ja="今回は深く\n紹介しませんでしたが他にも"
[[operations]]
op="insert"
segment_id="c058"
start=551.818
end=552.986
speaker="speaker_0"
ja="断面がギンギラな"
[[operations]]
op="insert"
segment_id="c059"
start=552.986
end=554.254
speaker="speaker_0"
ja="栗ぎんとん"
[[operations]]
op="insert"
segment_id="c060"
start=554.254
end=556.056
speaker="speaker_0"
ja="表面が銀色でコーティングされた"
[[operations]]
op="insert"
segment_id="c061"
start=556.056
end=557.257
speaker="speaker_0"
ja="ぎんつば"
[[operations]]
op="insert"
segment_id="c062"
start=557.257
end=559.192
speaker="speaker_0"
ja="ギンピラごぼう"
[[operations]]
op="insert"
segment_id="c063"
start=559.192
end=562.429
speaker="speaker_0"
ja="様々な銀沢名物を堪能しました"
[[operations]]
op="insert"
segment_id="c064"
start=562.429
end=564.197
speaker="speaker_0"
ja="お土産にはやっぱり定番の"
[[operations]]
op="insert"
segment_id="c065"
start=564.197
end=565.298
speaker="speaker_0"
ja="■■■ニア"
reason="原画白色伏字長方形を伏字として記録。隠された名称を推測復元しない。"
[[operations]]
op="insert"
segment_id="c066"
start=565.298
end=567.333
speaker="speaker_0"
ja="限定のシルバーなお洋服を着ていて"
[[operations]]
op="insert"
segment_id="c067"
start=567.333
end=568.802
speaker="speaker_0"
ja="非常に煌びやか"
[[operations]]
op="insert"
segment_id="c068"
start=568.802
end=570.537
speaker="speaker_0"
ja="とってもかわいいですよね"
[[operations]]
op="insert"
segment_id="c069"
start=570.537
end=573.440
speaker="speaker_0"
ja="バリエーションも豊富で選ぶのに一苦労でした"
[[operations]]
op="insert"
segment_id="c070"
start=573.440
end=576.409
speaker="speaker_0"
ja="冬になるとこのあたりは一面銀世界になるようで"
[[operations]]
op="insert"
segment_id="c071"
start=576.409
end=578.511
speaker="speaker_0"
ja="銀沢は姿を消した後ですが"
[[operations]]
op="insert"
segment_id="c072"
start=578.511
end=582.449
speaker="speaker_0"
ja="銀の面影や気配が感じられるのは\nなんとも面白いですよね"
[[operations]]
op="insert"
segment_id="c073"
start=582.449
end=584.751
speaker="speaker_0"
ja="みなさんも是非\n次のシルバーウィークには"
[[operations]]
op="insert"
segment_id="c074"
start=584.751
end=586.619
speaker="speaker_0"
ja="銀沢へ遊びに行ってみては"
[[operations]]
op="insert"
segment_id="c075"
start=586.619
end=588.188
speaker="speaker_0"
ja="いかがでしょうか"
[[operations]]
op="insert"
segment_id="c076"
start=588.188
end=590.990
speaker="speaker_0"
ja="ちなみに今回の5連休は11年ぶり"
[[operations]]
op="insert"
segment_id="c077"
start=590.990
end=592.892
speaker="speaker_0"
ja="次の大型シルバーウィークは"
[[operations]]
op="insert"
segment_id="c078"
start=592.892
end=594.761
speaker="speaker_0"
ja="6年後らしいですよ"
[[operations]]
op="insert"
segment_id="c079"
start=594.761
end=597.263
speaker="speaker_0"
ja="6年後のシルバーウィークを迎えるのが先か"
[[operations]]
op="insert"
segment_id="c080"
start=597.263
end=600.366
speaker="speaker_0"
ja="新たなキラキラ連休が生成されるのが先か"
[[operations]]
op="insert"
segment_id="c081"
start=600.366
end=601.801
speaker="speaker_0"
ja="見ものですね"
[[operations]]
op="insert"
segment_id="c082"
start=601.801
end=603.103
speaker="speaker_0"
ja="次は「銅沢」"
[[operations]]
op="insert"
segment_id="c083"
start=603.103
end=605.038
speaker="speaker_0"
ja="遊びに行ってみたいものです"
[[operations]]
op="insert"
segment_id="c084"
start=605.038
end=606.606
speaker="speaker_0"
ja="soreidewa ～"
