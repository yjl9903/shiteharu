end = 14.081
speaker = "speaker_0"
ja = "どうも「してはる」の「し」は\nシルバーウィークの「シ」"
[[operations]]
op = "insert"
segment_id = "a007"
start = 14.081
end = 16.250
speaker = "speaker_0"
ja = "自認シルバーウィークのしてはるです"
[[operations]]
op = "insert"
segment_id = "a008"
start = 16.250
end = 17.484
speaker = "speaker_0"
ja = "自認している割には"
[[operations]]
op = "insert"
segment_id = "a009"
start = 17.484
end = 20.888
speaker = "speaker_0"
ja = "何日から何日までがなんなのか\nさっぱりみたいな感じですが"
[[operations]]
op = "insert"
segment_id = "a010"
start = 20.888
end = 24.791
speaker = "speaker_0"
ja = "どうやら世間はお騒がせ天気の\n大型連休だったみたいですね"
[[operations]]
op = "insert"
segment_id = "a011"
start = 24.791
end = 26.994
speaker = "speaker_0"
ja = "そんな銀色週間なシルバーウィーク"
[[operations]]
op = "insert"
segment_id = "a012"
start = 26.994
end = 29.396
speaker = "speaker_0"
ja = "一体どこへお出かけするのが最適か"
[[operations]]
op = "insert"
segment_id = "a013"
start = 29.396
end = 30.531
speaker = "speaker_0"
ja = "ありますよね〜"
[[operations]]
