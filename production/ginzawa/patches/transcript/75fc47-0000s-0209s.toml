ja = "ゴールデンウィークに続いてシルバーウィークが出来たなら今後ブロンズウィークもプラチナウィークもオーロラウィークも期待できるのでは〜？"
[[operations]]
op = "insert"
segment_id = "a003"
start = 8.375
end = 8.809
