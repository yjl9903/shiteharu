start = 33.000
end = 34.334
speaker = "speaker_0"
ja = "みなさんが思い浮かべた"
[[operations]]
op = "insert"
segment_id = "a017"
start = 34.334
end = 35.435
speaker = "speaker_0"
ja = "まさにそこ！"
[[operations]]
op = "insert"
segment_id = "a018"
start = 35.435
end = 36.603
speaker = "speaker_0"
ja = "ということで今回は"
[[operations]]
op = "insert"
segment_id = "a019"
start = 36.603
end = 38.639
speaker = "speaker_0"
