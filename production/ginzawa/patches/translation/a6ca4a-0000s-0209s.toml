[[operations]]
op = "edit"
segment_id = "a001"
zh = "晚上汪～"
[[operations]]
op = "edit"
segment_id = "a002"
zh = "黄金周之后有了白银周 那以后是不是还能期待青铜周 铂金周 极光周呢～？"
[[operations]]
op = "edit"
segment_id = "a003"
zh = "这么想的"
[[operations]]
op = "edit"
segment_id = "a004"
zh = "各位～"
[[operations]]
op = "edit"
segment_id = "a005"
zh = "你们在做什么呀～"
[[operations]]
op = "edit"
segment_id = "a006"
zh = "「してはる」的shi\n就是「白银周」日语开头的shi"
[[operations]]
op = "edit"
segment_id = "a007"
zh = "我是自认白银周的してはる"
[[operations]]
op = "edit"
segment_id = "a008"
zh = "虽说是这么自认的"
[[operations]]
op = "edit"
segment_id = "a009"
zh = "但到底哪天到哪天算什么假期\n我好像完全搞不清楚"
[[operations]]
op = "edit"
segment_id = "a010"
zh = "不过大家似乎度过了一个\n天气很会惹事的小长假呢"
[[operations]]
op = "edit"
segment_id = "a011"
zh = "这个银光闪闪的白银周"
[[operations]]
op = "edit"
segment_id = "a012"
zh = "到底去哪里玩最合适呢"
[[operations]]
op = "edit"
segment_id = "a013"
zh = "当然有啦～"
[[operations]]
op = "edit"
segment_id = "a014"
zh = "有个再合适不过的地方"
[[operations]]
op = "edit"
segment_id = "a015"
zh = "没错"
[[operations]]
op = "edit"
segment_id = "a016"
zh = "你们想到的那个地方"
[[operations]]
op = "edit"
segment_id = "a017"
zh = "就是那里！"
[[operations]]
op = "edit"
segment_id = "a018"
zh = "所以这次要去的"
[[operations]]
op = "edit"
segment_id = "a019"
zh = "就是最有白银周气氛的地方"
[[operations]]
op = "edit"
segment_id = "a020"
zh = "石川县·银泽"
[[operations]]
op = "edit"
segment_id = "a021"
zh = "我们去玩吧～"
[[operations]]
op = "edit"
segment_id = "a022"
zh = "这次奢侈一把 坐新干线去"
[[operations]]
op = "edit"
segment_id = "a023"
zh = "平时不怎么坐新干线"
[[operations]]
op = "edit"
segment_id = "a024"
zh = "光是坐在座位上"
[[operations]]
op = "edit"
segment_id = "a025"
zh = "就已经有了出游和修学旅行的感觉"
[[operations]]
op = "edit"
segment_id = "a026"
zh = "超划算"
[[operations]]
op = "edit"
segment_id = "a027"
zh = "今天要去的银泽"
[[operations]]
op = "edit"
segment_id = "a028"
zh = "只在白银周期间现身"
[[operations]]
op = "edit"
segment_id = "a029"
zh = "是座超稀有的梦幻城市"
[[operations]]
op = "edit"
segment_id = "a030"
zh = "真让人期待呀"
[[operations]]
op = "edit"
segment_id = "a031"
zh = "好 到啦"
[[operations]]
op = "edit"
segment_id = "a032"
zh = "好厉害 车站的银色骨架真结实"
[[operations]]
op = "edit"
segment_id = "a033"
zh = "真壮观"
[[operations]]
op = "edit"
segment_id = "a034"
zh = "今天迎接我们的是～"
[[operations]]
op = "edit"
segment_id = "a035"
zh = "阴天"
[[operations]]
op = "edit"
segment_id = "a036"
zh = "真贴心啊"
[[operations]]
op = "edit"
segment_id = "a037"
zh = "连天空都配成了银色"
[[operations]]
op = "edit"
segment_id = "a038"
zh = "景观统一到这份上 真让人佩服"
[[operations]]
op = "edit"
segment_id = "a039"
zh = "第一站当然要去经典的"
[[operations]]
op = "edit"
segment_id = "a040"
zh = "茶屋街"
[[operations]]
op = "edit"
segment_id = "a041"
zh = "来都来了 就四处逛逛吧"
[[operations]]
op = "edit"
segment_id = "a042"
zh = "因为有着日本传统街景"
[[operations]]
op = "edit"
segment_id = "a043"
zh = "好像也有人把这里叫作「小京都」"
[[operations]]
op = "edit"
segment_id = "a044"
zh = "其实这话不能说"
[[operations]]
op = "edit"
segment_id = "a045"
zh = "想自称「小京都」\n得加入一个叫「全国京都会议」的组织"
[[operations]]
op = "edit"
segment_id = "a046"
zh = "而且还得满足规定的条件才能入会"
[[operations]]
op = "edit"
segment_id = "a047"
zh = "还挺有意思的吧"
[[operations]]
op = "edit"
segment_id = "a048"
zh = "这里以前好像也是成员"
[[operations]]
op = "edit"
segment_id = "a049"
zh = "不过2008年就退会了"
[[operations]]
op = "edit"
segment_id = "a050"
zh = "所以现在并不自称「小京都」"
[[operations]]
op = "edit"
segment_id = "a051"
zh = "每个地方都有自己的文化历史"
[[operations]]
op = "edit"
segment_id = "a052"
zh = "这称呼到底算不算夸奖\n开口前还是先想想吧"
[[operations]]
op = "edit"
segment_id = "a053"
zh = "咦 有什么东西"
[[operations]]
op = "edit"
segment_id = "a054"
zh = "这是…"
[[operations]]
op = "edit"
segment_id = "a055"
zh = "银鱼"
[[operations]]
op = "edit"
segment_id = "a056"
zh = "银泽的代表性观赏鱼\n是用鲫鱼改良培育出来的"
[[operations]]
op = "edit"
segment_id = "a057"
zh = "在水渠里游着…"
[[operations]]
op = "edit"
segment_id = "a058"
zh = "还真是在游呢"
[[operations]]
op = "edit"
segment_id = "a059"
zh = "这儿也有"
[[operations]]
op = "edit"
segment_id = "a060"
zh = "在这里算是日常景象吗"
[[operations]]
op = "edit"
segment_id = "a061"
zh = "话说"
[[operations]]
op = "edit"
segment_id = "a062"
zh = "这里寺庙神社真多\n建筑也都很讲究呢"
[[operations]]
op = "edit"
segment_id = "a063"
zh = "本来想见到寺庙神社就挨个拜\n结果没多久就放弃了"
[[operations]]
op = "edit"
segment_id = "a064"
zh = "改成想拜就拜的随性计划"
[[operations]]
op = "edit"
segment_id = "a065"
zh = "洗手漱口明明是为了净化身心"
[[operations]]
op = "edit"
segment_id = "a066"
zh = "对洁癖来说却像是受罪吧"
[[operations]]
op = "edit"
segment_id = "a067"
zh = "我每次都在一旁这样想"
[[operations]]
op = "edit"
segment_id = "a068"
zh = "然后毫不在意地漱口"
[[operations]]
op = "edit"
segment_id = "a069"
zh = "哎呀！"
[[operations]]
op = "edit"
segment_id = "a070"
zh = "忍者！"
[[operations]]
op = "edit"
segment_id = "a071"
zh = "明明是忍者\n却浑身写着快来发现我"
[[operations]]
op = "edit"
segment_id = "a072"
zh = "毕竟躲猫猫时一直没人发现\n也是会有点寂寞的"
[[operations]]
op = "edit"
segment_id = "a073"
zh = "那就配合一下 说声找到你啦"
[[operations]]
op = "edit"
segment_id = "a074"
zh = "我参拜时 周围的外国游客们"
[[operations]]
op = "edit"
segment_id = "a075"
zh = "跟着我鞠两次躬 拍两次手 再鞠躬"
[[operations]]
op = "edit"
segment_id = "a076"
zh = "可好玩了"
[[operations]]
op = "edit"
segment_id = "a077"
zh = "要是我鞠两次躬拍两次手再鞠躬后\n又猛拍手大旋转来个超级跳"
[[operations]]
op = "edit"
segment_id = "a078"
zh = "一群怪人和全新传统"
[[operations]]
op = "edit"
segment_id = "a079"
zh = "说不定就这样诞生了"
[[operations]]
op = "edit"
segment_id = "a080"
zh = "但作为日本人代表\n我还是努力忍住了"
[[operations]]
op = "edit"
segment_id = "a081"
zh = "来都来了 再抽个签吧"
[[operations]]
op = "edit"
segment_id = "a082"
zh = "してはる这个幸运的存在\n简直就是大吉本吉"
[[operations]]
op = "edit"
segment_id = "a083"
zh = "稳稳抽中了大吉"
[[operations]]
op = "edit"
segment_id = "a084"
zh = "这下有证据了"
[[operations]]
op = "edit"
segment_id = "a085"
zh = "咦"
[[operations]]
op = "edit"
segment_id = "a086"
zh = "是银杏树呢"
[[operations]]
op = "edit"
segment_id = "a087"
zh = "还没变色 仍是一片绿"
[[operations]]
op = "edit"
segment_id = "a088"
zh = "好～～～～～～～～多"
[[operations]]
op = "edit"
segment_id = "a089"
zh = "银杏果"
[[operations]]
op = "edit"
segment_id = "a090"
zh = "落下来时砰砰响 听着好沉"
[[operations]]
op = "edit"
segment_id = "a091"
zh = "踩到可就惨了 千万小心脚下"
[[operations]]
op = "edit"
segment_id = "a092"
zh = "不过树这么大 叶子果子掉这么多"
[[operations]]
op = "edit"
segment_id = "a093"
zh = "应该能找到一片「那个」吧…"
[[operations]]
op = "edit"
segment_id = "a094"
zh = "嗯～～～～～～～"
[[operations]]
op = "edit"
segment_id = "a095"
zh = "哦！"
[[operations]]
op = "edit"
segment_id = "a096"
zh = "找到了！"

